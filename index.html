<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsplash Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="header__title">Unsplash Gallery</h1>
            <div class="search">
                <div class="search__container">
                    <input 
                        type="text" 
                        class="search__input" 
                        placeholder="Поиск изображений..."
                        autocomplete="off"
                    >
                    <button class="search__clear" type="button">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10 8.586L2.929 1.515 1.515 2.929 8.586 10l-7.071 7.071 1.414 1.414L10 11.414l7.071 7.071 1.414-1.414L11.414 10l7.071-7.071-1.414-1.414L10 8.586z"/>
                        </svg>
                    </button>
                </div>
                <select class="filter">
                    <option value="relevant">По релевантности</option>
                    <option value="latest">Сначала новые</option>
                    <option value="popular">По популярности</option>
                </select>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="gallery" id="gallery">
                <div class="loading">Загрузка изображений...</div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Unsplash Gallery</p>
            <a href="https://github.com/oktxin" target="_blank" rel="noopener noreferrer">
                GitHub
            </a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Поиск фильмов</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bg-dark text-white py-3">
      <div class="container">
        <h1 class="text-center mb-0">Поиск фильмов</h1>
      </div>
    </header>

    <main class="container my-4">
      <form class="row g-3 mb-4" id="searchForm">
        <div class="col-md-8">
          <div class="position-relative">
            <input
              type="search"
              class="form-control"
              id="searchInput"
              placeholder="Введите название фильма..."
              autocomplete="off"
              autofocus
            />
            <button
              type="button"
              class="btn-close position-absolute top-50 end-0 translate-middle-y me-2"
              id="clearBtn"
              style="display: none"
              aria-label="Очистить"
            ></button>
          </div>
        </div>
        <div class="col-md-4">
          <select class="form-select" id="yearFilter">
            <option value="">Все годы</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
            <option value="2021">2021</option>
            <option value="2020">2020</option>
          </select>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary w-100 w-md-auto">
            Поиск
          </button>
        </div>
      </form>

      <div id="results" class="row"></div>
      <div
        id="noResults"
        class="text-center text-muted py-5"
        style="display: none"
      >
        <h3>Фильмы не найдены</h3>
        <p>Попробуйте другой запрос.</p>
      </div>
    </main>

    <footer class="bg-dark text-white py-3 mt-5">
      <div class="container text-center">
        <p>
          &copy; 2025 oktxin.
          <a
            href="https://github.com/oktxin/movie-search-app"
            class="text-white"
            target="_blank"
            >GitHub</a
          >
        </p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>

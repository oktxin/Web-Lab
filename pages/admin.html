<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - EmbedSocial</title>
    <link rel="stylesheet" href="../style/global.css">
    <link rel="stylesheet" href="../style/header.css">
    <link rel="stylesheet" href="../style/footer.css">
    <link rel="stylesheet" href="../style/responsive.css">
    <link rel="stylesheet" href="../style/admin.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <img src="../images/logo.png" alt="img-hero">
                <p>embedsocial</p>
            </div>
            <nav class="nav" id="mainNav">
                <a href="home.html" class="nav-link">Home</a>
                <a href="catalog.html" class="nav-link">Catalog</a>
                <a href="favorites.html" class="nav-link">Favorites</a>
                <a href="cart.html" class="nav-link">Cart</a>
            </nav>
            <div class="nav-button">
                <a href="admin.html" class="nav-button-link admin active">Админ-панель</a>
            </div>
            <div class="burger-menu" id="burgerMenu">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="admin-container">
            <div class="admin-header">
                <h1>Админ-панель</h1>
                <p>Управление товарами и отзывами</p>
            </div>

            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="products">Управление товарами</button>
                <button class="admin-tab" data-tab="reviews">Управление отзывами</button>
            </div>

            <div id="productsTab" class="admin-content active">
                <h2>Добавить/редактировать товар</h2>
                <form id="productForm" class="admin-form">
                    <input type="hidden" id="productId">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="productName">Название товара*</label>
                            <input type="text" id="productName" required>
                            <div class="error-message" id="productNameError"></div>
                        </div>
                        
                        <div class="form-group">
                            <label for="productPrice">Цена (руб)*</label>
                            <input type="number" id="productPrice" min="0" step="0.01" required>
                            <div class="error-message" id="productPriceError"></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="productCategory">Категория*</label>
                            <input type="text" id="productCategory" required>
                            <div class="error-message" id="productCategoryError"></div>
                        </div>
                        
                        <div class="form-group">
                            <label for="productRating">Рейтинг (0-5)</label>
                            <input type="number" id="productRating" min="0" max="5" step="0.1">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="productImage">URL изображения*</label>
                            <input type="url" id="productImage" required>
                            <div class="error-message" id="productImageError"></div>
                        </div>
                        
                        <div class="form-group">
                            <label for="productComplexity">Сложность</label>
                            <select id="productComplexity">
                                <option value="">Выберите сложность</option>
                                <option value="Легкий">Легкий</option>
                                <option value="Средний">Средний</option>
                                <option value="Сложный">Сложный</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="productDescription">Описание</label>
                        <textarea id="productDescription" rows="4"></textarea>
                    </div>

                    <button type="submit" id="submitProduct" class="admin-button">Добавить товар</button>
                </form>

                <h2>Список товаров</h2>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Изображение</th>
                            <th>Название</th>
                            <th>Категория</th>
                            <th>Цена</th>
                            <th>Рейтинг</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="productsList">
                    </tbody>
                </table>
            </div>

            <div id="reviewsTab" class="admin-content">
                <h2>Фильтры отзывов</h2>
                <div class="admin-filters">
                    <div class="form-group">
                        <label for="reviewFilterProduct">Фильтр по товару</label>
                        <select id="reviewFilterProduct">
                            <option value="">Все товары</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="reviewFilterUser">Фильтр по пользователю</label>
                        <select id="reviewFilterUser">
                            <option value="">Все пользователи</option>
                        </select>
                    </div>
                </div>

                <h2>Список отзывов</h2>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Товар</th>
                            <th>Пользователь</th>
                            <th>Рейтинг</th>
                            <th>Текст отзыва</th>
                            <th>Дата</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="reviewsAdminList">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
